<h1>Communicating with WebSockets</h1>
<input id="msg" /><button id="send">Send</button>
<div id="output"></div>
<script>
    const ws = new WebSocket('ws://localhost:3000');
    const output = document.getElementById('output');
    const send = document.getElementById('send');

    send.addEventListener('click', () => {
        const msg = document.getElementById('msg').value;
        ws.send(msg);
        output.appendChild( log('Sent', msg));
    });

    function log(event, msg) {
        const p = document.createElement('p');
        p.textContent = event + ': ' + msg;
        return p;
    }

    ws.onmessage = function (e) {
        output.appendChild( log('Received', e.data));
    };
    ws.onclose = function (e) {
        output.appendChild( log('Disconnected', e.code));
    };
    ws.onerror = function (e) {
        output.appendChild( log('Error', e.data));
    };

</script>
